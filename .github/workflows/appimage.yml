name: Build AppImage (Steam Deck)

# Manual: Actions -> "Build AppImage (Steam Deck)" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest   # x86_64: what the Steam Deck is
    timeout-minutes: 60
    # Debian bookworm's glibc (2.36) is older than SteamOS's, so the bundle runs there and
    # on most current distros. (A bundle built on a newer distro would not run on older ones.)
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates curl file patchelf \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libcurl4-openssl-dev libarchive-dev \
            librsvg2-bin imagemagick

      - uses: actions/checkout@v4

      - name: Build the AppImage
        run: packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zonto-volcano-appimage
          path: dist/*.AppImage
          retention-days: 14
          compression-level: 0  # already compressed
